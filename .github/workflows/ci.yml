name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt is clean
        run: test -z "$(gofmt -l .)"
      - name: The generated API surface matches the checked-in OpenAPI snapshot
        run: python3 scripts/gen_catalog.py && git diff --exit-code -- . ':!scripts/openapi.snapshot.json'
      - run: go vet ./... && go test ./...
      - run: cd gin && go vet ./... && go test ./...
      - run: cd echo && go vet ./... && go test ./...
      - run: cd otel && go mod tidy && go vet ./... && go test ./...
